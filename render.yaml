services:
  - type: web
    name: smart-ai-code-reviewer-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        value: sqlite:///./smart_reviewer.db
      - key: CORS_ORIGIN
        value: https://smart-ai-code-reviewer.vercel.app
    plan: free
